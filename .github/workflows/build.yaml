name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        distribution: [ temurin, graalvm ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: ${{ matrix.distribution }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Format check
        run: ./gradlew --console=plain --no-daemon spotlessCheck

      - name: Build
        run: ./gradlew --console=plain --no-daemon build

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build fat jar
        run: ./gradlew --console=plain --no-daemon :cli:fatjar

      - name: Generate snapshot tag name
        id: tag
        run: |
          TAG_NAME="snapshot-$(date +%F)-${GITHUB_SHA::7}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          files: "cli/build/libs/japg-cli-0.1.0.jar"
        env:
          GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
